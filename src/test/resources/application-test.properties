spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# create-drop (et non update) : plusieurs contextes Spring peuvent se succeder dans
# le meme JVM de test (un par configuration : @SpringBootTest, @AutoConfigureMockMvc...)
# et partagent la meme base "jdbc:h2:mem:test". Avec update, les tables survivent d'un
# contexte a l'autre et data-test.sql serait rejoue sur des donnees existantes
# -> violation de cle primaire. create-drop recree un schema vierge a chaque contexte.
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.data-locations=classpath:data-test.sql
application.init=false

spring.jpa.defer-datasource-initialization=true