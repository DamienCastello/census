spring.application.name=census
spring.datasource.url=jdbc:mysql://localhost:3306/census
spring.datasource.username=admin
spring.datasource.password=azerty

# Schema recree a chaque demarrage, puis rechargé par data.sql : la base de dev
# repart toujours du meme jeu de donnees (les modifications faites via l'API sont perdues).
spring.jpa.hibernate.ddl-auto=create-drop

# Chargement de data.sql :
#  - mode=always : sans cela, Spring ne joue data.sql que sur une base embarquee (H2)
#  - defer : attend qu'Hibernate ait cree les tables avant d'inserer
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Affiche les requetes generees par Spring Data (utile pour verifier les repositories)
spring.jpa.show-sql=true

# Recupere les noms de departements sur geo.api.gouv.fr au demarrage.
# Reste a true tant que ddl-auto=create-drop : la base etant recreee a chaque
# demarrage, les noms doivent etre recharges a chaque fois. A passer a false
# seulement si l'on repasse a ddl-auto=update (base persistante).
application.init=true