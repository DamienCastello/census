spring.application.name=census

# ==========================================================================
#  CONNEXION A LA BASE
# ==========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/census
spring.datasource.username=admin
spring.datasource.password=azerty


# ==========================================================================
#  QUI CREE LES TABLES ?
# ==========================================================================
# create-drop : Hibernate SUPPRIME et RECREE les tables a chaque demarrage,
#               puis les supprime a l'arret. La base repart donc vierge a
#               chaque lancement (les donnees creees via l'API sont perdues).
#
# Autres valeurs possibles :
#   update   : cree/complete les tables, NE SUPPRIME RIEN (donnees conservees)
#   validate : verifie seulement que le schema correspond aux entites
#   none     : Hibernate ne touche pas au schema
#
# En production : validate ou none (create-drop detruirait tout a chaque deploiement).
spring.jpa.hibernate.ddl-auto=create-drop


# ==========================================================================
#  QUI REMPLIT LES TABLES ?
# ==========================================================================
# Le fichier src/main/resources/data.sql est joue au demarrage : il insere
# les 100 departements et les 1001 villes.
#
# mode=always : par defaut Spring ne joue data.sql que sur une base EMBARQUEE
#               (H2, jetable). Sur MySQL il s'abstient, sans aucun message.
#               "always" veut dire : joue-le quand meme.
#
# defer=true  : sans cela data.sql partirait AVANT qu'Hibernate ait cree les
#               tables -> erreur "table doesn't exist". "defer" le fait
#               attendre que les tables existent.
#
# L'une dit "vas-y", l'autre dit "attends ton tour". Il faut LES DEUX.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --------------------------------------------------------------------------
#  /!\ REGLE A RESPECTER : ces deux blocs doivent etre coherents
# --------------------------------------------------------------------------
# data.sql est rejoue A CHAQUE demarrage, sans condition. Il n'y a donc que
# deux combinaisons valides :
#
#   1) ddl-auto=create-drop  +  sql.init.mode=always   <-- configuration actuelle
#      Tables recreees vides, puis remplies. Toujours coherent.
#
#   2) ddl-auto=update       +  sql.init.mode=never
#      Les donnees survivent aux redemarrages ; data.sql n'est plus rejoue.
#      (A utiliser avec application.init=false, voir plus bas.)
#
# Melanger update + always provoque :
#      "Duplicate entry '1' for key 'departments.PRIMARY'"
# car data.sql reinsere des lignes deja presentes.


# ==========================================================================
#  NOMS DES DEPARTEMENTS (API externe)
# ==========================================================================
# data.sql ne fournit pas les noms de departements (colonne vide). Au demarrage,
# DepartmentService.initData() les recupere sur https://geo.api.gouv.fr/departements.
#
# true  : recuperation a chaque demarrage -> indispensable avec create-drop,
#         puisque la base repart vierge et perd les noms.
# false : aucun appel reseau. A utiliser avec la combinaison 2 ci-dessus,
#         ou les noms restent en base d'un demarrage a l'autre.
application.init=true


# ==========================================================================
#  DEBUG
# ==========================================================================
# Affiche dans la console les requetes SQL generees par Spring Data.
# Pratique pour verifier ce que produisent les requetes derivees et reperer
# les problemes de type N+1. A passer a false si la console est trop bavarde.
spring.jpa.show-sql=true
